name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        run: dotnet test .\RepoAgentHost.sln --configuration Release
      - name: Check whitespace
        run: git diff --check
      - name: Package Agent Plugin
        run: .\scripts\pack-plugin.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: repo-agent-host-plugin
          path: artifacts/plugins/*.zip
          if-no-files-found: error
